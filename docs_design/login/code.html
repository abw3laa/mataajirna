<body class="bg-surface text-on-surface font-body-md antialiased min-h-screen flex flex-col md:flex-row selection:bg-primary-container selection:text-on-primary-container">
<!-- Note: TopAppBar and BottomNavBar are suppressed intentionally as this is a linear/transactional screen (Login). -->
<!-- Image / Branding Section (Hidden on Mobile, Half Screen on Desktop) -->

<div class="absolute inset-0 bg-cover bg-center" data-alt="A sophisticated, high-end conceptual still-life photography piece representing luxury e-commerce. The scene features minimalist geometric pedestals in soft cream and pristine white tones, elegantly arranged in a bright, light-mode studio. Subtle, warm natural sunlight casts soft, diffused shadows, creating a serene and premium aesthetic. The overall mood is effortless luxury, with precise systematic layout and expansive whitespace, emphasizing a corporate-minimalist hybrid style." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuACCAWh6gLMEvhKlW3lVlsyUAUUHQFd3gzGyjZCLmH_vrPZidyt8BBy5kZ1_027TbWCtc0SdjuUGpnWd0fH9zektv-c_VNtJdh-FikfVXLTHcx6-3cF7WD7txBL1e1jLwKIzvgafE2D8chn3ePcX5EKFiDPdj7d-VYaQoUSOhdNZwaiVGQbKZRDmm9DfsZPp9oU6DAlFxDdbDPF7Fr65_CdAp4t0rBINBNA-L5zvFTnKhuKYZiqr9fo')"></div>
<div class="absolute inset-0 bg-gradient-to-t from-surface-dim/80 to-transparent"></div>
<div class="absolute bottom-12 right-12 text-surface-container-lowest">
<h2 class="font-display-lg text-display-lg mb-2 text-white drop-shadow-md">اكتشف الجودة</h2>
<p class="font-body-lg text-body-lg text-white/90 max-w-md drop-shadow-sm">وجهتك الأولى للتسوق الراقي والموثوق.</p>
</div>
</div>
<!-- Login Form Section -->
<div class="w-full md:w-1/2 flex items-center justify-center p-6 sm:p-12 lg:p-24 bg-surface relative">
<!-- Subtle background decorative blob -->
<div class="absolute top-0 right-0 w-64 h-64 bg-primary-fixed rounded-full mix-blend-multiply filter blur-3xl opacity-20 transform -translate-x-1/2 -translate-y-1/2"></div>
<div class="w-full max-w-md space-y-8 z-10">
<!-- Header -->
<div class="text-right space-y-2">
<div class="w-12 h-12 bg-primary-container text-on-primary-container rounded-xl flex items-center justify-center mb-6 shadow-sm">
<span class="material-symbols-outlined text-3xl">storefront</span>
</div>
<h1 class="font-display-lg text-display-lg text-on-surface">مرحباً بعودتك</h1>
<p class="font-body-md text-body-md text-on-surface-variant">سجل دخولك للمتابعة إلى حسابك</p>
</div>
<!-- Form -->
<form class="space-y-6" onsubmit="event.preventDefault();">
<!-- Email / Phone Field -->
<div class="space-y-2 text-right">
<label class="block font-label-md text-label-md text-on-surface" for="identifier">البريد الإلكتروني أو رقم الهاتف</label>
<div class="relative">
<div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">person</span>
</div>
<input class="block w-full pr-10 pl-3 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg text-on-surface font-body-md focus:ring-2 focus:ring-primary focus:border-primary transition-all shadow-sm placeholder-outline" dir="rtl" id="identifier" name="identifier" placeholder="أدخل بريدك أو رقمك" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2 text-right">
<div class="flex items-center justify-between">
<a class="font-label-sm text-label-sm text-primary hover:text-on-primary-fixed-variant transition-colors" href="#">نسيت كلمة المرور؟</a>
<label class="block font-label-md text-label-md text-on-surface" for="password">كلمة المرور</label>
</div>
<div class="relative">
<div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="block w-full pr-10 pl-3 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg text-on-surface font-body-md focus:ring-2 focus:ring-primary focus:border-primary transition-all shadow-sm placeholder-outline text-left" dir="ltr" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Submit Button -->
<div class="pt-2">
<button class="w-full flex justify-center py-3.5 px-4 border border-transparent rounded-lg shadow-sm font-headline-sm text-headline-sm text-on-primary bg-primary hover:bg-on-primary-fixed-variant focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors active:scale-[0.98]" type="submit">
                        تسجيل الدخول
                    </button>
</div>
</form>
<!-- Divider -->
<div class="mt-8">
<div class="relative">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-surface text-on-surface-variant font-label-sm text-label-sm">أو</span>
</div>
</div>
</div>
<!-- Sign Up Prompt -->
<div class="text-center font-body-md text-body-md mt-6">
<span class="text-on-surface-variant">ليس لديك حساب؟</span>
<a class="font-label-md text-label-md text-primary hover:underline hover:text-on-primary-fixed-variant mr-1" href="#">إنشاء حساب جديد</a>
</div>
</div>
</div>
