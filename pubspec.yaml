name: mataajirna
description: "متجرنا - تطبيق تجارة إلكترونية عربي (RTL) بواجهتين مستخدم/مدير"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Firebase (طبقة الخادم - تتطلب ربط مشروعك الخاص عبر flutterfire configure)
  firebase_core: ^3.4.0
  firebase_auth: ^5.2.0
  cloud_firestore: ^5.4.0
  cloud_functions: ^5.1.0
  firebase_storage: ^12.3.0

  # Localization / i18n
  intl: ^0.20.2

  # UI / utils
  cached_network_image: ^3.4.1
  flutter_secure_storage: ^9.2.2
  equatable: ^2.0.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  google_fonts: ^6.2.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  generate: true # يفعّل توليد ملفات الترجمة من lib/l10n/*.arb عبر l10n.yaml

  assets:
    - assets/images/
